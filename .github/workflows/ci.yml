name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check logsearch tests
      - run: ruff format --check .
      - run: pytest -q
      # Every `logsearch` invocation that appears in a shell block in the
      # README, in the form the README writes it, because a documented command
      # nobody runs rots. The correspondence is pinned by
      # tests/test_cli.py::test_every_documented_invocation_is_in_the_offline_ci_job,
      # so adding a command to the README without adding it here fails above.
      - run: logsearch lint
      - run: logsearch lifecycle
      - run: logsearch compare
      - run: logsearch fields logs-app --grep url
      - run: logsearch explain message
      - run: logsearch explain log.level
      - run: logsearch bootstrap > /dev/null
      - run: logsearch query --dropped event.duration_ms > /dev/null
      - run: logsearch query --since now-1h --service checkout-api --level warn --message timeout --agg by-url.path --agg over-time > /dev/null
      # Not in the README. The audit template is the one with no catch-all, so
      # its composed mapping is worth walking as well.
      - run: logsearch fields logs-audit
      # The exit codes from the README's table, asserted rather than assumed.
      # 1 is a loss the report names: one message loses its keyword half to
      # ignore_above under every strategy, and the two lenient runs lose more
      # than that. A 0 here would mean the loss counting stopped working.
      - name: the strict run exits 1 for its one silent loss
        run: |
          logsearch ingest --strategy strict > /dev/null && code=0 || code=$?
          test "$code" = "1"
      - name: the normalize run exits 1 with six events held back
        run: |
          logsearch ingest --strategy normalize --dead-letter held.jsonl > /dev/null && code=0 || code=$?
          test "$code" = "1"
      - name: the lenient run exits 1 with fourteen values dropped
        run: |
          logsearch ingest --strategy ignore-malformed --show-losses > /dev/null && code=0 || code=$?
          test "$code" = "1"
      # 2 is a refusal rather than a finding: an unknown template name is a
      # usage error, not a lint result, and the two codes have to stay apart.
      - name: an unknown template is refused with 2
        run: |
          logsearch fields logs-nope > /dev/null 2>&1 && code=0 || code=$?
          test "$code" = "2"

  cluster:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.license.self_generated.type: basic
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      # No health-cmd on the service: the Elasticsearch image is not required
      # to carry curl, and a health check that cannot run leaves the job
      # waiting for a container that is already up. The runner has curl.
      - name: wait for the cluster
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:9200/_cluster/health >/dev/null; then
              curl -sS http://localhost:9200 | head -20
              exit 0
            fi
            sleep 2
          done
          echo "elasticsearch did not answer within 120s"
          exit 1
      # The only tests that could say whether logsearch/conflicts.py is right
      # about Elasticsearch rather than merely consistent with itself. This job
      # has never run: the repository has no remote.
      - name: the live suite
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: pytest -m live -q
      # Installing the real templates through the real API is its own check: a
      # composed template with a typo in composed_of is rejected at PUT time,
      # and that is the one mistake in this repo a cluster catches.
      - name: install the templates and read them back
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          python -c "
          from logsearch.client import connect, install, write_index_of
          from logsearch.templates import TemplateSet
          client = connect()
          for name, result in install(client, TemplateSet()):
              print(f'{name}: {result}')
          print('logs-app write index:', write_index_of(client, 'logs-app'))
          print('logs-audit write index:', write_index_of(client, 'logs-audit'))
          "
          curl -fsS http://localhost:9200/_index_template/logs-app | head -c 400
